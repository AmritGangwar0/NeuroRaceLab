version: 0.1

vehicle:
  model: dynamic_bicycle
  mass_kg: 1200
  yaw_inertia_kg_m2: 1500
  front_axle_m: 1.2
  rear_axle_m: 1.3
  front_cornering_stiffness_n_per_rad: 70000
  rear_cornering_stiffness_n_per_rad: 80000
  max_steering_rad: 0.45
  max_drive_force_n: 5000
  max_brake_force_n: 9000
  rolling_resistance: 0.015
  drag_coefficient: 0.35
  frontal_area_m2: 2.0
  air_density_kg_m3: 1.225

simulation:
  physics_dt_s: 0.01
  control_dt_s: 0.05
  physics_steps_per_control: 5
  integrator: rk4

sensors:
  ray_count: 32
  fov_deg: 240
  max_range_m: 30
  speed_reference_mps: 30
  slip_angle_reference_rad: 0.5
  yaw_rate_reference_rad_s: 2.5
  include_current_steering: true

track:
  centerline_spacing_m: 1.0
  default_width_m: 8.0

episode:
  max_duration_s: 120
  initial_speed_mps: 5
