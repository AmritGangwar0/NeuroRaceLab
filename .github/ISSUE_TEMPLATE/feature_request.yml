name: Feature request
description: Propose a focused engineering or research improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or research question
      description: What limitation or question would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How should success be measured?
      description: Include tests, metrics, and comparison conditions where relevant.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs and alternatives
